  SNOOPER_JWT_SECRET: /jwt.hex
  SNOOPER_VERBOSE: "true"
  SNOOPER_XATU_ENABLED: "true"
  SNOOPER_XATU_NAME: "{{ ethereum_network_name }}-{{ inventory_hostname }}"
  SNOOPER_XATU_NETWORK_NAME: "{{ ethereum_network_name }}"
  SNOOPER_XATU_NETWORK_ID: "{{ ethereum_network_id }}"
  SNOOPER_XATU_OUTPUTS: "xatu:{{ secret_xatu_sentry.server_address }}"
  SNOOPER_XATU_TLS: "true"
  SNOOPER_XATU_HEADERS: "authorization=Basic {{ (secret_xatu_sentry.user + ':' + secret_xatu_sentry.password) | b64encode }}"
